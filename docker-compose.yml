services:
  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,cloudformation,iam,lambda,logs,s3,sts,ssm,apigateway,execute-api
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
      - LAMBDA_EXECUTOR=local
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./Backend:/workspace/Backend:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  api:
    build: ./Backend
    container_name: python-api
    ports:
      - "8050:8050"
    env_file:
      - ./Backend/.env
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
      - DYNAMODB_URL=http://localstack:4566
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=120
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_started

  cdk-local:
    image: node:22-bullseye
    container_name: cdk-local
    working_dir: /workspace/Infra/cdk-local
    volumes:
      - ./:/workspace
      - ./Infra/cdk-local/.aws/credentials:/root/.aws/credentials:ro
      - ./Infra/cdk-local/.aws/config:/root/.aws/config:ro
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - CDK_DEFAULT_ACCOUNT=000000000000
      - CDK_DEFAULT_REGION=us-east-1
      - LOCALSTACK_HOST=localstack
    depends_on:
      localstack:
        condition: service_healthy
    command: >
      sh -c "
        apt-get update -qq && apt-get install -y -qq python3 python3-pip &&
        pip3 install -r requirements.txt -q &&
        npm install -q &&
        npm run bootstrap:local &&
        npm run deploy:local &&
        echo 'CDK deploy complete' &&
        tail -f /dev/null
      "

  frontend:
    build: ./Frontend/e-commerce
    container_name: react-frontend
    ports:
      - "3000:80"        # el browser accede en localhost:3000, Nginx escucha en el 80
    depends_on:
      - api

volumes:
  localstack-data:
